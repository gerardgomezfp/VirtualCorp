all:
  children:
    vbox:
      hosts:
        localhost:
          ansible_connection: local
          vboxmanage_bin: VBoxManage
          mikrotik_routers:
            - mikrotik0
            - mikrotik1
            - mikrotik2
            - mikrotik3

    # Aqui definim com ansible podra entrar al router0 de vcorp, amb el seu port, clau privada i usuari
    mikrotik:
      hosts:
        mikrotik0:
          ansible_host: mikrotik-vcorp
          ansible_port: 2200
          ansible_user: sysadmin
          ansible_ssh_private_key_file: ~/.ssh/vcorp_sysadmin
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: community.routeros.routeros

    # Aqui definim com ansible podra entrar al contenido dhcp01, amb la seva ip, clau privada i usuari root.
    dhcp_servers:
      hosts:
        dhcp01:
          ansible_host: 10.8.0.137
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/vcorp_sysadmin