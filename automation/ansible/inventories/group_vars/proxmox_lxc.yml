---
ansible_user: root
ansible_ssh_private_key_file: ~/.ssh/vcorp_sysadmin
# IP de administración para hosts sin IP estática: se resuelve desde la lista
# terraform_service_ip_assignments. dhcp01 la trae del inventario generado.
ansible_host: >-
  {{ (terraform_service_ip_assignments
      | selectattr('hostname', 'equalto', inventory_hostname)
      | map(attribute='ip_address') | list | first) }}
