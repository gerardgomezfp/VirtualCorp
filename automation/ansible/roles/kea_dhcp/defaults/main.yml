---
kea_package_name: "kea-dhcp4-server"
kea_service_name: "kea-dhcp4-server"
kea_config_path: "/etc/kea/kea-dhcp4.conf"

# Interfaz de red en la que escucha Kea dentro de dhcp01
kea_interfaces:
  - "eth0"

# Sin servidor DNS anunciado hasta desplegarlo en la siguiente fase
kea_dns_servers: []
kea_domain_name: "virtualcorp.local"

kea_valid_lifetime: 3600
kea_renew_timer: 1800
kea_rebind_timer: 2700

# Subredes con asignación DHCP (se excluyen enlaces punto a punto entre routers)
kea_dhcp4_subnets:
  - id: 1
    subnet: "10.8.0.128/26"
    pools:
      - pool: "10.8.0.150 - 10.8.0.185"
    option-data:
      - name: "routers"
        data: "10.8.0.129"
    reservations:
      - hostname: "dbsrv"
        hw-address: "08:00:27:2e:eb:85"
        ip-address: "10.8.0.134"
      - hostname: "infosrv"
        hw-address: "08:00:27:5f:c1:79"
        ip-address: "10.8.0.135"
      - hostname: "intrasrv"
        hw-address: "08:00:27:38:a3:03"
        ip-address: "10.8.0.136"

