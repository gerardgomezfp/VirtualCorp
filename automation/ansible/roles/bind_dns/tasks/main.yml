---
- name: Recopilar los paquetes instalados
  ansible.builtin.package_facts:
    manager: apt

- name: Fijar un resolvedor temporal en dhclient (solo antes de instalar BIND9)
  ansible.builtin.lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: '^supersede domain-name-servers'
    line: "supersede domain-name-servers {{ bind_bootstrap_resolver }};"
  when: "'bind9' not in ansible_facts.packages"

- name: Aplicar ahora el resolvedor temporal a resolv.conf (solo antes de instalar BIND9)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      domain {{ bind_search_domain }}
      search {{ bind_search_domain }}
      nameserver {{ bind_bootstrap_resolver }}
    mode: "0644"
  when: "'bind9' not in ansible_facts.packages"

- name: Instalar BIND9 y sus utilidades
  ansible.builtin.apt:
    name: "{{ bind_packages }}"
    state: present
    update_cache: true

- name: Habilitar e iniciar el servicio BIND9
  ansible.builtin.systemd:
    name: "{{ bind_service_name }}"
    enabled: true
    state: started
