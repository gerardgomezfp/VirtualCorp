---
- name: Recopilar los paquetes instalados
  ansible.builtin.package_facts:
    manager: apt

- name: Fijar un resolvedor temporal en dhclient (solo antes de instalar BIND9)
  ansible.builtin.lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: '^supersede domain-name-servers'
    line: "supersede domain-name-servers {{ bind_bootstrap_resolver }};"
  when: "'bind9' not in ansible_facts.packages"

- name: Aplicar ahora el resolvedor temporal a resolv.conf (solo antes de instalar BIND9)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      domain {{ bind_search_domain }}
      search {{ bind_search_domain }}
      nameserver {{ bind_bootstrap_resolver }}
    mode: "0644"
  when: "'bind9' not in ansible_facts.packages"

- name: Instalar BIND9 y sus utilidades
  ansible.builtin.apt:
    name: "{{ bind_packages }}"
    state: present
    update_cache: true

- name: Habilitar e iniciar el servicio BIND9
  ansible.builtin.systemd:
    name: "{{ bind_service_name }}"
    enabled: true
    state: started

# --- En roles/bind_dns/tasks/main.yml ---
- name: Crear el directori per als fitxers de zona de BIND9
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: "0750"

- name: Desplegar les opcions globals de BIND9
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: Recarregar BIND9

- name: Desplegar la declaració de zones locals de BIND9
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Recarregar BIND9

- name: Desplegar els fitxers de zona de la Delegació 8
  ansible.builtin.template:
    src: db.zone.j2
    dest: "{{ item.file }}"
    owner: root
    group: bind
    mode: "0644"
  loop: "{{ bind_zones }}"
  notify: Recarregar BIND9

- name: Validar la sintaxi global de BIND9 amb named-checkconf
  ansible.builtin.command:
    cmd: named-checkconf
  changed_when: false

- name: Validar cada fitxer de zona amb named-checkzone
  ansible.builtin.command:
    cmd: "named-checkzone {{ item.name }} {{ item.file }}"
  loop: "{{ bind_zones }}"
  changed_when: false