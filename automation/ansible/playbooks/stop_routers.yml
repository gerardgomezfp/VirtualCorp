---
- name: Aturar els routers de VirtualCorp
  hosts: localhost
  gather_facts: false
  #tascas que fara el yml en aquest cas, aplicar els rols i aturar els routers microtik
  tasks:
    - name: Aplicar el rol d'aturada a cada router
      ansible.builtin.include_role:
        name: stop_vm
      vars:
        vm_name: "{{ router_vm }}"
        vboxmanage_bin: "{{ hostvars['localhost']['vboxmanage_bin'] }}"
      loop: "{{ mikrotik_routers }}"
      loop_control:
        loop_var: router_vm