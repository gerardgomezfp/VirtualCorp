[defaults]
# Ruta predeterminada del fitxer d'inventari on es defineixen els equips i servidors
inventory = inventories

# Directori on Ansible busca i carrega els rols personalitzats
roles_path = roles

# Activa la comprovació de la clau SSH del host per motius de seguretat
host_key_checking = True

# Desactiva la creació automàtica de fitxers de reintent (.retry) quan falla un playbook
retry_files_enabled = False

[persistent_connection]
# Defineix el mètode de connexió persistent automàtic (ideal per a dispositius de xarxa com MikroTik)
ssh_type = auto


